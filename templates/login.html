<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaCore - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f6f8;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            padding: 3rem 2.5rem;
        }
        .login-input {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            width: 100%;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
        }
        .login-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background-color: #ffffff;
        }
        .login-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 0.5rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="text-center mb-5">
                <div class="brand-text" style="font-size: 2rem; margin-bottom: 0.5rem;">AQUACORE</div>
                <div style="color: #6b7280; font-size: 0.9rem; font-weight: 500;">Secure Water Infrastructure Access</div>
            </div>
            
            <form method="POST" action="/login">
                <div>
                    <label class="login-label">Email Address</label>
                    <input type="email" name="username" class="login-input" value="admin@aquacore.io" required>
                </div>
                <div>
                    <label class="login-label">Password</label>
                    <input type="password" name="password" class="login-input" value="password123" required>
                </div>
                
                <button type="submit" class="btn btn-dark w-100 mt-2 py-3" style="font-size: 1rem;">Sign In</button>
            </form>
            
            <div class="text-center mt-4" style="font-size: 0.8rem; color: #9ca3af;">
                Authorized personnel only. All access is logged.
            </div>
        </div>
    </div>
</body>
</html>
